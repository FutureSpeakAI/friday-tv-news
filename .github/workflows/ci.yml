name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    name: Build and test the apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon testReleaseUnitTest
      - name: Release builds (debug-signed in CI; no keystore here)
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            android/news/build/outputs/apk/release/*.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: android/*/build/reports/tests/

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
