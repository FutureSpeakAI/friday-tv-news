plugins { id 'com.android.application' }
apply from: rootProject.file('signing.gradle')

android {
    namespace 'ai.futurespeak.friday.tv.news'
    compileSdk 36

    defaultConfig {
        applicationId 'ai.futurespeak.friday.tv.news'
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig fridayReleaseSigning(android)   // see ../signing.gradle; never commit a keystore
        }
    }
    testOptions { unitTests.returnDefaultValues = false }
    lint { abortOnError false; checkReleaseBuilds false }
}

// No third-party runtime libraries: no analytics, no SDKs. The add-on SDK is our own, vendored code.
dependencies {
    implementation project(':addon-sdk')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260814'
}
